<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PIXEL STREET DRAG // Pixel Car Racer Legends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090b10;
      --panel-bg: rgba(15, 19, 28, 0.96);
      --panel-border: #2a3346;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2a6d;
      --neon-amber: #ffaa00;
      --neon-green: #05ffa1;
      --text-main: #eef2f7;
      --text-dim: #7f8ea3;
      --font-pixel: 'Press Start 2P', monospace;
      --font-hud: 'Chakra Petch', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-hud);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    header.top-bar {
      height: 54px;
      background: linear-gradient(180deg, #161b26 0%, #0d1017 100%);
      border-bottom: 2px solid #2b3548;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--neon-pink);
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 9px;
      padding: 5px 8px;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
    }

    .brand-title {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: #fff;
      text-shadow: 2px 2px 0 #000, 0 0 10px rgba(0, 240, 255, 0.4);
      letter-spacing: 0.5px;
    }

    .top-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      background: #0a0d13;
      border: 1px solid #2e384d;
      padding: 5px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .stat-pill.money {
      color: var(--neon-green);
      border-color: rgba(5, 255, 161, 0.35);
    }

    .stat-pill.tier {
      color: var(--neon-cyan);
      border-color: rgba(0, 240, 255, 0.35);
    }

    .btn-icon {
      background: #171d29;
      border: 1px solid #354159;
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 12px;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* MAIN VIEWPORT */
    main#app-container {
      flex: 1;
      position: relative;
      display: flex;
      overflow: hidden;
    }

    /* GARAGE VIEW */
    #garage-view {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      padding: 14px;
      background:
        radial-gradient(circle at 28% 35%, rgba(0, 240, 255, 0.06), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255, 42, 109, 0.06), transparent 50%),
        #090b10;
    }

    @media (max-width: 960px) {
      #garage-view {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
    }

    /* LEFT: SHOWROOM */
    .showroom-panel {
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }

    .car-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .car-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .nav-car-btn {
      background: #171d29;
      border: 1px solid #3c4863;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 4px;
      font-family: var(--font-pixel);
      font-size: 11px;
      cursor: pointer;
    }

    .nav-car-btn:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .car-title-box {
      flex: 1;
    }

    .car-title-box h2 {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .car-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-drive {
      background: rgba(0, 240, 255, 0.14);
      border: 1px solid rgba(0, 240, 255, 0.45);
      color: var(--neon-cyan);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
    }

    .tag-kit {
      background: rgba(255, 42, 109, 0.14);
      border: 1px solid rgba(255, 42, 109, 0.45);
      color: var(--neon-pink);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
    }

    .car-canvas-wrap {
      flex: 1;
      min-height: 175px;
      margin: 8px 0;
      background: #07090e;
      border: 2px solid #222a3a;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #garage-canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .rev-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 19, 28, 0.9);
      border: 1px solid var(--neon-amber);
      color: var(--neon-amber);
      font-family: var(--font-pixel);
      font-size: 8px;
      padding: 7px 9px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.1s;
    }

    .rev-btn:active, .rev-btn.active {
      background: var(--neon-amber);
      color: #000;
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
    }

    .car-owned-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: var(--font-pixel);
      font-size: 7px;
      padding: 4px 8px;
      border-radius: 3px;
      background: rgba(5, 255, 161, 0.16);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
    }

    .car-owned-badge.locked {
      background: rgba(255, 170, 0, 0.16);
      border-color: var(--neon-amber);
      color: var(--neon-amber);
    }

    /* SPECS GRID */
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .spec-box {
      background: #0c0f16;
      border: 1px solid #242d3e;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .spec-label {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spec-val {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .spec-val span {
      font-size: 10px;
      color: var(--neon-cyan);
    }

    /* MAPS & DIFFICULTY CONTROLS */
    .config-row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .config-box {
      background: #0c0f16;
      border: 1px solid #283246;
      border-radius: 5px;
      padding: 7px 9px;
    }

    .config-header {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .config-select {
      width: 100%;
      background: #141923;
      border: 1px solid #2c364b;
      color: #fff;
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 11px;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .diff-options-mini {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .diff-btn {
      background: #141923;
      border: 1px solid #2c364b;
      color: var(--text-dim);
      padding: 5px 2px;
      border-radius: 3px;
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 9px;
      cursor: pointer;
      text-align: center;
    }

    .diff-btn.active[data-diff="easy"] { background: rgba(5,255,161,0.15); border-color: var(--neon-green); color: var(--neon-green); }
    .diff-btn.active[data-diff="medium"] { background: rgba(0,240,255,0.15); border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .diff-btn.active[data-diff="hard"] { background: rgba(255,170,0,0.15); border-color: var(--neon-amber); color: var(--neon-amber); }
    .diff-btn.active[data-diff="legend"] { background: rgba(255,42,109,0.18); border-color: var(--neon-pink); color: var(--neon-pink); }

    /* RACE LAUNCH CONTROLS */
    .race-launch-bar {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .dist-select {
      background: #111622;
      border: 1px solid #35425c;
      color: #fff;
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 12px;
      padding: 0 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-primary-action {
      flex: 1;
      background: linear-gradient(135deg, #ff2a6d 0%, #d91b57 100%);
      border: 2px solid #ff6b99;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 10px;
      padding: 12px 14px;
      border-radius: 4px;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 0 16px rgba(255, 42, 109, 0.45);
      transition: transform 0.1s, filter 0.15s;
    }

    .btn-primary-action:hover { filter: brightness(1.1); }
    .btn-primary-action:active { transform: translateY(2px); }

    .btn-primary-action.buy-mode {
      background: linear-gradient(135deg, #05ffa1 0%, #00b874 100%);
      border-color: #8affd4;
      color: #041a11;
      text-shadow: none;
      box-shadow: 0 0 16px rgba(5, 255, 161, 0.4);
    }

    /* RIGHT: TUNING PANEL */
    .tuning-panel {
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #0b0e14;
      border-bottom: 2px solid #263042;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-right: 1px solid #1e2636;
      color: var(--text-dim);
      font-family: var(--font-pixel);
      font-size: 8px;
      padding: 12px 4px;
      cursor: pointer;
      transition: 0.15s;
    }

    .tab-btn:last-child { border-right: none; }
    .tab-btn.active {
      background: #161c28;
      color: var(--neon-cyan);
      box-shadow: inset 0 -3px 0 var(--neon-cyan);
    }

    .tab-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 9px;
    }

    .tab-content.active { display: flex; }

    /* UPGRADE CARDS */
    .upgrade-card {
      background: #0d111a;
      border: 1px solid #263045;
      border-radius: 5px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .upg-info h4 { font-size: 13px; color: #fff; margin-bottom: 2px; }
    .upg-info p { font-size: 10px; color: var(--text-dim); }

    .stage-pips { display: flex; gap: 4px; margin-top: 4px; }
    .pip { width: 16px; height: 4px; background: #1f2738; border-radius: 2px; }
    .pip.filled { background: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }

    .btn-upgrade {
      background: #172030;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 88px;
      text-align: center;
    }

    .btn-upgrade:hover:not(:disabled) { background: var(--neon-cyan); color: #05080d; }
    .btn-upgrade:disabled { border-color: #2f394d; color: #5a6780; cursor: not-allowed; }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--neon-amber);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    .kit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .kit-card {
      background: #0d111a;
      border: 1px solid #283247;
      border-radius: 5px;
      padding: 7px 9px;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }
    .kit-card:hover { border-color: #53668c; }
    .kit-card.equipped { border-color: var(--neon-green); background: rgba(5, 255, 161, 0.08); }
    .kit-card-top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 11px; color: #fff; }
    .kit-card-sub { font-size: 10px; color: var(--text-dim); }
    .kit-price { font-size: 10px; font-weight: 700; color: var(--neon-amber); }
    .kit-card.owned .kit-price { color: var(--neon-cyan); }
    .kit-card.equipped .kit-price { color: var(--neon-green); }

    .swatches-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
    .swatch { aspect-ratio: 1; border-radius: 4px; border: 2px solid #2a3447; cursor: pointer; transition: transform 0.1s; }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 8px #fff; }

    .custom-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d111a;
      border: 1px solid #263045;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
    }

    .pill-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .pill-opt {
      background: #0d111a;
      border: 1px solid #2a3447;
      color: var(--text-dim);
      padding: 6px 4px;
      border-radius: 4px;
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
    }
    .pill-opt.active { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(0, 240, 255, 0.1); }

    /* RACE VIEW */
    #race-view {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #05070b;
      z-index: 30;
    }
    #race-view.active { display: flex; }
    #race-canvas { flex: 1; width: 100%; height: 100%; display: block; image-rendering: pixelated; }

    .race-top-hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .progress-tracker {
      background: rgba(10, 13, 20, 0.88);
      border: 1px solid #323e57;
      border-radius: 5px;
      padding: 8px 12px;
      width: 310px;
    }

    .prog-labels { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; margin-bottom: 5px; color: var(--text-dim); }
    .prog-track { height: 10px; background: #141a26; border-radius: 3px; position: relative; overflow: hidden; border: 1px solid #293347; }
    .prog-marker { position: absolute; top: 1px; width: 8px; height: 8px; border-radius: 2px; transform: translateX(-50%); }
    .prog-marker.rival { background: var(--neon-pink); box-shadow: 0 0 6px var(--neon-pink); }
    .prog-marker.player { background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); z-index: 2; }

    .shift-banner {
      font-family: var(--font-pixel);
      font-size: 11px;
      padding: 7px 12px;
      border-radius: 4px;
      background
